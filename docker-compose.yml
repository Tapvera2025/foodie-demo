# Local development only. Staging and production run managed Postgres and Redis
# on a private network with no public endpoint. See docs/tech/infrastructure.md.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: foodcourt
      POSTGRES_PASSWORD: foodcourt
      POSTGRES_DB: foodcourt
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U foodcourt']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
