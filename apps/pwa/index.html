<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + safe-area padding in CSS: the sticky checkout bar
         must sit above the iPhone home indicator, not under it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      The browser chrome tint on Android, and the one piece of the ORIGINAL
      design still shipping. #FC8019 is Swiggy's orange; the brand has been
      #CF3A32 since the redesign. It survived because nothing renders it on a
      laptop — it colours the address bar on an Android phone and nowhere else,
      so every review of "does this look right" was conducted on the one device
      that cannot see it.

      Two values, because the bar should match the page behind it rather than
      the brand: a red strip above a white app looks like a banner that failed
      to load. `media` picks per the OS setting, which is the only signal
      available before any script runs.
    -->
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <!--
      iOS ignores the web manifest's icons when adding to the Home Screen and
      reads this link instead. `includeAssets` in vite.config.ts copies the
      file into the build; only the link has to live here.

      It matters more than an icon usually would: Web Push on iOS Safari works
      ONLY from a home-screen install, so this is the first link in that chain
      — see `pushViability()` in docs/tech/frontend.md.
    -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Order · Food Court</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
